which-ingest: "{!ENV: MERRITT_INGEST !DEFAULT: ingest-docker}"
ingest-docker: 
  ingest-info: &ingestinfo
    name: "{!ENV: CONFIG_NAME !DEFAULT: UC3 Ingest }"
    identifier: "ingest"
    target: "{!ENV: TARGET_ID !DEFAULT: http://ingest:8080 }"
    description: "UC3 ingest docker micro-service"
    service-scheme: "Ingest/0.1"
    access-uri: "http://ingest:8080"
    ezid: "ezid-user:ezid-password"
    support-uri: "http://www.cdlib.org/services/uc3/contact.html"
    # mail-host: "{!SSM: ingest/config/mail-host !DEFAULT: localhost}"
    mail-host: "smtp"
    mail-contact: "merritt@cdlib.org"
    mail-replyto: "uc3@ucop.edu"
    admin: "test@email"
    purl: "http://n2t.net/"
    ingestServicePath: "/merritt-filesys/ingest"
    ingestQueuePath: "/merritt-filesys/ingest/queue"
    s3endpoint: "{!ENV: S3ENDPOINT !DEFAULT: }"
    s3accesskey: "{!ENV: S3ACCESSKEY !DEFAULT: }"
    s3secretkey: "{!ENV: S3SECRETKEY !DEFAULT: }"
    s3config_bucket: "{!ENV: S3CONFIG_BUCKET !DEFAULT: mrt-config}"
    s3config_prefix: "{!ENV: S3CONFIG_PREFIX !DEFAULT: uc3/mrt/mrt-ingest-profiles}"
    ingestZfsThreshold: "80"
    metadataDisplaySize: "350"
    ingestLock: "/mrt.lock"
    NumDownloadThreads: "2"

  store-info: &storeinfo
    store.1: "http://store:8080/store"
    access.1: "http://store:8080/store"
    localID: "http://inventory:8080/inventory"

  queue-info: &queueinfo
    QueueService: "{!ENV: ZKCONN !DEFAULT: zoo:2181}"
    PollingInterval: "30"
    NumThreads: "{!ENV: NUM_THREADS !DEFAULT: 3}"
    BatchPollingInterval: "15"
    BatchNumThreads: "{!ENV: BATCH_NUM_THREADS !DEFAULT: 3}"
    
  logger-info: &loggerinfo
    messageMaximumLevel: 5
    messageMaximumError: 10
    path: "logs"
    name: "ingest"
    qualifier: "yyMMdd"
    trace: 5

ecs:
  ingest-info:
    <<: *ingestinfo
    ezid: "{!SSM: ingest/ezid-user}:{!SSM: ingest/ezid-password}"
  store-info:
    <<: *storeinfo
  queue-info:
    <<: *queueinfo
  logger-info:
    <<: *loggerinfo
